<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <rect width="500" height="500" rx="60" fill="#dc2626"/>
  <!-- Medical cross -->
  <g fill="#ffffff">
    <rect x="215" y="100" width="70" height="210" rx="8"/>
    <rect x="145" y="170" width="210" height="70" rx="8"/>
  </g>
  <!-- Magnifying glass -->
  <circle cx="340" cy="300" r="50" fill="#dc2626" stroke="#ffffff" stroke-width="18"/>
  <line x1="375" y1="338" x2="410" y2="375" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <text x="250" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#ffffff">ICD-10</text>
</svg>